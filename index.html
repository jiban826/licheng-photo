<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c3e50">
<title>梨城摄友 - 库尔勒中老年摄影社交</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#222;font-size:16px;line-height:1.6;padding-bottom:80px;}
:root{--primary:#2c3e50;--primary-light:#3498db;--accent:#e67e22;--bg:#f5f5f5;--card:#fff;--text:#222;--text-light:#888;--border:#eee;--safe-bottom:env(safe-area-inset-bottom,0px);}

/* Splash */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#2c3e50,#1a252f);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s;}
#splash.hide{opacity:0;pointer-events:none;}
#splash .logo{font-size:64px;margin-bottom:16px;}
#splash h1{color:#fff;font-size:24px;font-weight:700;letter-spacing:2px;}
#splash .sub{color:rgba(255,255,255,.5);font-size:14px;margin-top:6px;}
#splash .loading-text{color:rgba(255,255,255,.3);font-size:12px;margin-top:24px;}

/* Header */
.app-header{background:linear-gradient(135deg,#2c3e50,#34495e);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:100;}
.app-header h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;}
.app-header .sub{font-size:12px;opacity:.7;margin-top:2px;}
.header-tabs{display:flex;gap:4px;margin-top:10px;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;}
.header-tabs .tab{flex:1;text-align:center;padding:6px 0;border-radius:8px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer;transition:.2s;}
.header-tabs .tab.active{background:#fff;color:#2c3e50;font-weight:600;}

/* Pages */
.page{display:none;}
.page.active{display:block;}

/* Feed */
.feed{padding:12px;}
.post-card{background:#fff;border-radius:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;}
.post-card .post-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f0f0f0;}
.post-card .post-body{padding:12px 14px;}
.post-card .post-user{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.post-card .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3498db,#2c3e50);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0;}
.post-card .uname{font-size:15px;font-weight:600;}
.post-card .uloc{font-size:12px;color:var(--text-light);}
.post-card .post-desc{font-size:14px;color:#444;margin-bottom:8px;line-height:1.7;}
.post-card .post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.post-card .tag{background:#eef2f7;color:#2c3e50;padding:2px 10px;border-radius:12px;font-size:11px;}
.post-card .post-actions{display:flex;gap:20px;padding-top:8px;border-top:1px solid #f0f0f0;}
.post-card .action{display:flex;align-items:center;gap:4px;font-size:13px;color:#999;cursor:pointer;}
.post-card .action.liked{color:#e74c3c;}
.post-card .action .num{font-size:12px;}
.post-card .post-time{font-size:11px;color:#bbb;margin-top:6px;}

/* Activities */
.activity-list{padding:12px;}
.activity-card{background:#fff;border-radius:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;}
.activity-card .ac-header{padding:14px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;}
.activity-card .ac-title{font-size:17px;font-weight:700;}
.activity-card .ac-status{font-size:11px;padding:3px 10px;border-radius:10px;background:#e8f5e9;color:#2e7d32;}
.activity-card .ac-status.full{background:#fce4ec;color:#c62828;}
.activity-card .ac-status.ended{background:#f5f5f5;color:#999;}
.activity-card .ac-body{padding:10px 14px 14px;}
.activity-card .ac-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.activity-card .ac-meta-item{font-size:13px;color:#666;display:flex;align-items:center;gap:4px;}
.activity-card .ac-desc{font-size:14px;color:#555;line-height:1.7;margin-bottom:10px;}
.activity-card .ac-org{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid #f0f0f0;}
.activity-card .ac-org .o-name{font-size:13px;font-weight:600;}
.activity-card .ac-btn{background:var(--primary-light);color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;}
.activity-card .ac-btn:active{transform:scale(.97);}
.activity-card .ac-btn.joined{background:#e0e0e0;color:#888;}

/* Spots */
.spot-list{padding:12px;}
.spot-card{background:#fff;border-radius:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;display:flex;}
.spot-card .spot-img{width:100px;flex-shrink:0;background:#f0f0f0;}
.spot-card .spot-img img{width:100%;height:100%;object-fit:cover;}
.spot-card .spot-body{padding:12px;flex:1;}
.spot-card .spot-name{font-size:16px;font-weight:700;margin-bottom:2px;}
.spot-card .spot-type{font-size:11px;color:var(--primary-light);margin-bottom:4px;}
.spot-card .spot-desc{font-size:13px;color:#666;line-height:1.6;}
.spot-card .spot-count{font-size:11px;color:#bbb;margin-top:6px;}

/* Pub Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .3s ease-out;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-sheet h2{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.modal-close{font-size:24px;cursor:pointer;color:#999;float:right;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:14px;font-weight:600;color:#555;margin-bottom:4px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;background:#fafafa;}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary-light);background:#fff;}
.form-group textarea{min-height:80px;resize:vertical;}
.file-input-wrap{position:relative;}
.file-input-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.file-input-wrap .file-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:#eef2f7;border-radius:10px;font-size:14px;color:#555;cursor:pointer;}
.btn-primary{width:100%;padding:14px;background:var(--primary-light);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
.btn-primary:active{transform:scale(.98);}

/* Profile */
.profile-header{text-align:center;padding:24px 16px;background:#fff;margin:12px;border-radius:14px;}
.profile-header .big-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#3498db,#2c3e50);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;}
.profile-header .p-name{font-size:20px;font-weight:700;}
.profile-header .p-loc{font-size:13px;color:#888;margin-top:2px;}
.profile-stats{display:flex;justify-content:center;gap:30px;margin-top:12px;}
.profile-stats .stat{text-align:center;}
.profile-stats .num{font-size:20px;font-weight:700;color:var(--primary);}
.profile-stats .label{font-size:11px;color:#999;}
.profile-section{margin:12px;background:#fff;border-radius:14px;padding:16px;}
.profile-section h3{font-size:15px;margin-bottom:10px;color:var(--primary);}
.profile-section .my-post{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #f5f5f5;}
.profile-section .my-post:last-child{border:none;}
.profile-section .my-post .mp-img{width:48px;height:48px;border-radius:8px;background:#f0f0f0;flex-shrink:0;}
.profile-section .my-post .mp-title{font-size:13px;font-weight:600;}
.profile-section .my-post .mp-date{font-size:11px;color:#bbb;}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:#bbb;}
.empty-state .icon{font-size:48px;margin-bottom:12px;}
.empty-state p{font-size:14px;}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;padding:6px 0 calc(6px + var(--safe-bottom));z-index:200;box-shadow:0 -1px 8px rgba(0,0,0,.05);}
.bottom-nav .nav-item{flex:1;text-align:center;padding:4px 0;cursor:pointer;transition:.2s;}
.bottom-nav .nav-item .ni-icon{font-size:24px;}
.bottom-nav .nav-item .ni-label{font-size:10px;color:#999;margin-top:1px;}
.bottom-nav .nav-item.active .ni-label{color:var(--primary-light);font-weight:600;}
.bottom-nav .nav-item .ni-badge{background:#e74c3c;color:#fff;font-size:10px;padding:1px 5px;border-radius:10px;position:absolute;margin-left:12px;margin-top:-4px;}

/* FAB */
.fab{position:fixed;bottom:80px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(230,126,34,.3);z-index:150;display:flex;align-items:center;justify-content:center;transition:.2s;}
.fab:active{transform:scale(.9);}

/* Toast */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 24px;border-radius:24px;font-size:14px;z-index:999;opacity:0;transition:.3s;pointer-events:none;max-width:80%;text-align:center;}
#toast.show{opacity:1;}

@media(min-width:600px){
  body{padding-bottom:0;max-width:500px;margin:0 auto;border-left:1px solid #eee;border-right:1px solid #eee;min-height:100vh;background:#fff;}
  .bottom-nav{max-width:500px;left:50%;transform:translateX(-50%);}
  .fab{right:calc(50% - 234px);}
  #toast{left:50%;transform:translateX(-50%);}
}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <div class="logo">📸</div>
  <h1>梨城摄友</h1>
  <div class="sub">库尔勒中老年摄影爱好者社区</div>
  <div class="loading-text">加载中...</div>
</div>

<!-- Header -->
<div class="app-header">
  <h1>📸 梨城摄友</h1>
  <div class="sub">🏠 库尔勒 · 中老年摄影圈</div>
</div>

<!-- ===== PAGE: FEED ===== -->
<div id="pageFeed" class="page active">
  <div style="padding:4px 12px 0;font-size:12px;color:#999;display:flex;gap:12px;flex-wrap:wrap;">
    <span>📍 库尔勒</span>
    <span>👥 <span id="userCount">0</span>位摄友</span>
  </div>
  <div id="feedList" class="feed"></div>
</div>

<!-- ===== PAGE: ACTIVITIES ===== -->
<div id="pageActivity" class="page">
  <div id="activityList" class="activity-list"></div>
</div>

<!-- ===== PAGE: SPOTS ===== -->
<div id="pageSpots" class="page">
  <div id="spotList" class="spot-list"></div>
</div>

<!-- ===== PAGE: PROFILE ===== -->
<div id="pageProfile" class="page">
  <div class="profile-header">
    <div class="big-avatar" id="myAvatar">我</div>
    <div class="p-name" id="myName">我的梨城摄友</div>
    <div class="p-loc" id="myLoc">📍 新疆 · 库尔勒</div>
    <div class="profile-stats">
      <div class="stat"><div class="num" id="statPosts">0</div><div class="label">作品</div></div>
      <div class="stat"><div class="num" id="statActs">0</div><div class="label">活动</div></div>
      <div class="stat"><div class="num" id="statLikes">0</div><div class="label">获赞</div></div>
    </div>
  </div>
  <div class="profile-section">
    <h3>📷 我的作品</h3>
    <div id="myPosts"></div>
  </div>
  <div class="profile-section">
    <h3>🎯 我的活动</h3>
    <div id="myActivities"></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="showPublishModal()">＋</button>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('feed')">
    <div class="ni-icon">🏠</div>
    <div class="ni-label">作品</div>
  </div>
  <div class="nav-item" onclick="switchTab('activity')">
    <div class="ni-icon">🎯</div>
    <div class="ni-label">活动</div>
  </div>
  <div class="nav-item" onclick="switchTab('spots')">
    <div class="ni-icon">📍</div>
    <div class="ni-label">摄点</div>
  </div>
  <div class="nav-item" onclick="switchTab('profile')">
    <div class="ni-icon">👤</div>
    <div class="ni-label">我的</div>
  </div>
</div>

<!-- Publish Modal -->
<div class="modal-overlay" id="publishModal">
  <div class="modal-sheet">
    <span class="modal-close" onclick="closeModal('publishModal')">✕</span>
    <h2>📸 发布新作品</h2>
    <div class="form-group">
      <label>选择照片</label>
      <div class="file-input-wrap">
        <div class="file-btn" id="photoFileName">📷 点击选择照片</div>
        <input type="file" accept="image/*" id="photoInput" onchange="onPhotoSelect(event)">
      </div>
    </div>
    <div class="form-group">
      <label>拍摄地点</label>
      <select id="pubLocation">
        <option value="孔雀河">孔雀河</option>
        <option value="天鹅河">天鹅河</option>
        <option value="杜鹃河">杜鹃河</option>
        <option value="风帆广场">风帆广场</option>
        <option value="建设桥">建设桥</option>
        <option value="龙山公园">龙山公园</option>
        <option value="铁门关">铁门关</option>
        <option value="博斯腾湖">博斯腾湖</option>
        <option value="轮台胡杨林">轮台胡杨林</option>
        <option value="尉犁罗布人村寨">尉犁罗布人村寨</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>作品说明</label>
      <textarea id="pubDesc" placeholder="说说拍摄心得、使用的器材…"></textarea>
    </div>
    <div class="form-group">
      <label>标签（逗号分隔）</label>
      <input id="pubTags" placeholder="例如：胡杨,日出,风光" value="风光">
    </div>
    <button class="btn-primary" onclick="publishPost()">✨ 发布作品</button>
  </div>
</div>

<!-- Create Activity Modal -->
<div class="modal-overlay" id="activityModal">
  <div class="modal-sheet">
    <span class="modal-close" onclick="closeModal('activityModal')">✕</span>
    <h2>🎯 发起采风活动</h2>
    <div class="form-group">
      <label>活动名称</label>
      <input id="actTitle" placeholder="例如：孔雀河日出拍摄">
    </div>
    <div class="form-group">
      <label>活动地点</label>
      <select id="actLocation">
        <option value="孔雀河">孔雀河</option>
        <option value="天鹅河">天鹅河</option>
        <option value="风帆广场">风帆广场</option>
        <option value="龙山公园">龙山公园</option>
        <option value="铁门关">铁门关</option>
        <option value="博斯腾湖">博斯腾湖</option>
        <option value="轮台胡杨林">轮台胡杨林</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label>活动日期</label>
      <input type="date" id="actDate">
    </div>
    <div class="form-group">
      <label>时间</label>
      <input type="time" id="actTime" value="07:00">
    </div>
    <div class="form-group">
      <label>人数上限</label>
      <input type="number" id="actMax" value="10" min="2" max="50">
    </div>
    <div class="form-group">
      <label>活动详情</label>
      <textarea id="actDesc" placeholder="描述拍摄计划、集合地点、注意事项…"></textarea>
    </div>
    <div class="form-group">
      <label>联系方式</label>
      <input id="actContact" placeholder="微信号或手机号">
    </div>
    <button class="btn-primary" onclick="publishActivity()">🎯 发布活动</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ===== SAMPLE DATA =====

      {id:'a3',title:'手机摄影技巧分享会',org:'快乐摄影人',location:'风帆广场茶楼',date:'2026-10-26',time:'16:00',max:15,joined:8,desc:'不用单反，手机也能拍好照片。分享构图、光线、后期技巧。欢迎退休朋友参加。',contact:'kuaile666',status:'进行中'}
    ];
    localStorage.setItem('lc_activities',JSON.stringify(sampleActs));

// ===== STATE =====
var currentTab='feed';
var currentUser='我';
var photoFileData=null;

// ===== INIT =====
function init(){
  // Hide splash
  setTimeout(function(){document.getElementById('splash').classList.add('hide');},500);
  renderFeed();
  renderActivities();
  renderSpots();
  renderProfile();
  updateUserCount();
}

// ===== NAV =====
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
  document.getElementById('pageFeed').classList.toggle('active',tab==='feed');
  document.getElementById('pageActivity').classList.toggle('active',tab==='activity');
  document.getElementById('pageSpots').classList.toggle('active',tab==='spots');
  document.getElementById('pageProfile').classList.toggle('active',tab==='profile');
  document.querySelectorAll('.nav-item')[tab==='feed'?0:tab==='activity'?1:tab==='spots'?2:3].classList.add('active');
  if(tab==='feed') document.getElementById('fabBtn').style.display='flex';
  else if(tab==='activity') document.getElementById('fabBtn').style.display='flex';
  else document.getElementById('fabBtn').style.display='none';
}

// ===== RENDER FEED =====
function renderFeed(){
  var photos=getPhotos();
  var list=document.getElementById('feedList');
  if(photos.length===0){
    list.innerHTML='<div class="empty-state"><div class="icon">📸</div><p>还没有作品<br>点击下方 + 发布第一张照片！</p></div>';
    return;
  }
  var html='';
  photos.forEach(function(p,i){
    html+='<div class="post-card anim-in">'+
      (p.image?'<img class="post-img" src="'+p.image+'" alt="摄影作品">':'<div class="post-img" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f5f7fa,#e8ecf1);color:#bbb;font-size:36px;">📷</div>')+
      '<div class="post-body">'+
        '<div class="post-user">'+
          '<div class="avatar">'+p.avatar+'</div>'+
          '<div><div class="uname">'+p.user+'</div><div class="uloc">📍 '+p.location+'</div></div>'+
        '</div>'+
        '<div class="post-desc">'+p.desc+'</div>'+
        '<div class="post-tags">'+p.tags.map(function(t){return '<span class="tag">#'+t+'</span>';}).join('')+'</div>'+
        '<div class="post-actions">'+
          '<div class="action'+(p.liked?' liked':'')+'" onclick="toggleLike('+i+')">'+(p.liked?'❤️':'🤍')+' <span class="num">'+p.likes+'</span></div>'+
          '<div class="action">💬 <span class="num">'+p.comments+'</span></div>'+
          '<div class="action" style="margin-left:auto;">🔗</div>'+
        '</div>'+
        '<div class="post-time">'+p.time+'</div>'+
      '</div></div>';
  });
  list.innerHTML=html;
}

function toggleLike(idx){
  var photos=getPhotos();
  photos[idx].liked=!photos[idx].liked;
  photos[idx].likes+=photos[idx].liked?1:-1;
  savePhotos(photos);
  renderFeed();
  renderProfile();
}

// ===== RENDER ACTIVITIES =====
function renderActivities(){
  var acts=getActivities();
  var list=document.getElementById('activityList');
  if(acts.length===0){
    list.innerHTML='<div class="empty-state"><div class="icon">🎯</div><p>还没有采风活动<br>点击下方 + 发起一个活动！</p></div>';
    return;
  }
  var html='';
  acts.forEach(function(a,i){
    var statusClass='';
    var statusText=a.status||'进行中';
    if(a.joined>=a.max){statusClass=' full';statusText='已满';}
    html+='<div class="activity-card anim-in">'+
      '<div class="ac-header"><div class="ac-title">'+a.title+'</div><div class="ac-status'+statusClass+'">'+statusText+'</div></div>'+
      '<div class="ac-body">'+
        '<div class="ac-meta">'+
          '<span class="ac-meta-item">📅 '+a.date+'</span>'+
          '<span class="ac-meta-item">⏰ '+a.time+'</span>'+
          '<span class="ac-meta-item">📍 '+a.location+'</span>'+
          '<span class="ac-meta-item">👥 '+a.joined+'/'+a.max+'人</span>'+
        '</div>'+
        '<div class="ac-desc">'+a.desc+'</div>'+
        '<div class="ac-org">'+
          '<div class="avatar" style="width:28px;height:28px;font-size:12px;">'+(a.orgAvatar||a.org[0])+'</div>'+
          '<div><div class="o-name">发起人：'+a.org+'</div></div>'+
          '<button class="ac-btn'+(a.joined?' joined':'')+'" onclick="toggleJoin('+i+')">'+(a.joined?'✅ 已报名':'✋ 我要参加')+'</button>'+
        '</div>'+
      '</div></div>';
  });
  list.innerHTML=html;
}

function toggleJoin(idx){
  var acts=getActivities();
  if(acts[idx].joined>=acts[idx].max){showToast('名额已满');return;}
  acts[idx].joined++;
  if(acts[idx].joined>=acts[idx].max) acts[idx].status='已满';
  saveActivities(acts);
  renderActivities();
  showToast('✅ 报名成功！');
}

// ===== PROFILE =====
function renderProfile(){
  var photos=getPhotos();
  var acts=getActivities();
  var myPhotos=photos.filter(function(p){return p.user===currentUser;});
  var myActs=acts.filter(function(a){return a.org===currentUser;});
  var totalLikes=photos.reduce(function(s,p){return s+p.likes;},0);
  document.getElementById('statPosts').textContent=myPhotos.length;
  document.getElementById('statActs').textContent=myActs.length;
  document.getElementById('statLikes').textContent=totalLikes;
  
  // My posts
  var mph='';
  if(myPhotos.length===0) mph='<div style="text-align:center;padding:10px;color:#ccc;font-size:13px;">还没有发布作品</div>';
  else myPhotos.forEach(function(p){
    mph+='<div class="my-post"><div class="mp-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#f5f7fa,#e8ecf1);">📷</div><div><div class="mp-title">'+p.location+' · '+(p.tags[0]||'')+'</div><div class="mp-date">'+p.time+' · ❤️ '+p.likes+'</div></div></div>';
  });
  document.getElementById('myPosts').innerHTML=mph;
  
  // My activities
  var mah='';
  if(myActs.length===0) mah='<div style="text-align:center;padding:10px;color:#ccc;font-size:13px;">还没有发起活动</div>';
  else myActs.forEach(function(a){
    mah+='<div class="my-post"><div style="font-size:24px;width:48px;text-align:center;">🎯</div><div><div class="mp-title">'+a.title+'</div><div class="mp-date">'+a.date+' · '+a.joined+'/'+a.max+'人</div></div></div>';
  });
  document.getElementById('myActivities').innerHTML=mah;
}

function updateUserCount(){
  var photos=getPhotos();
  var users=new Set(photos.map(function(p){return p.user;}));
  document.getElementById('userCount').textContent=users.size;
}

// ===== PUBLISH =====
function showPublishModal(){
  if(currentTab==='activity'){
    // Show activity modal
    document.getElementById('activityModal').classList.add('show');
  }else{
    document.getElementById('publishModal').classList.add('show');
  }
}

function closeModal(id){
  document.getElementById(id).classList.remove('show');
}

function onPhotoSelect(e){
  var file=e.target.files[0];
  if(!file) return;
  document.getElementById('photoFileName').textContent='✅ '+file.name;
  var reader=new FileReader();
  reader.onload=function(ev){
    photoFileData=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function publishPost(){
  var desc=document.getElementById('pubDesc').value.trim();
  var loc=document.getElementById('pubLocation').value;
  var tagsInput=document.getElementById('pubTags').value.trim();
  if(!desc){showToast('请填写作品说明');return;}
  var tags=tagsInput?tagsInput.split(/[,，]/).map(function(t){return t.trim();}).filter(function(t){return t;}):['风光'];
  
  var photos=getPhotos();
  var now=new Date();
  photos.unshift({
    id:'p'+Date.now(),
    user:currentUser,
    avatar:currentUser[0],
    location:loc,
    desc:desc,
    tags:tags,
    likes:0,
    comments:0,
    liked:false,
    time:now.getFullYear()+'-'+(now.getMonth()+1).toString().padStart(2,'0')+'-'+now.getDate().toString().padStart(2,'0'),
    image:photoFileData||''
  });
  savePhotos(photos);
  
  // Reset
  photoFileData=null;
  document.getElementById('photoFileName').textContent='📷 点击选择照片';
  document.getElementById('pubDesc').value='';
  document.getElementById('pubTags').value='风光';
  document.getElementById('photoInput').value='';
  
  closeModal('publishModal');
  renderFeed();
  renderProfile();
  updateUserCount();
  showToast('✅ 作品发布成功！');
}

function publishActivity(){
  var title=document.getElementById('actTitle').value.trim();
  var loc=document.getElementById('actLocation').value;
  var date=document.getElementById('actDate').value;
  var time=document.getElementById('actTime').value;
  var max=parseInt(document.getElementById('actMax').value)||10;
  var desc=document.getElementById('actDesc').value.trim();
  var contact=document.getElementById('actContact').value.trim();
  
  if(!title){showToast('请填写活动名称');return;}
  if(!date){showToast('请选择活动日期');return;}
  if(!desc){showToast('请填写活动详情');return;}
  
  var acts=getActivities();
  acts.push({
    id:'a'+Date.now(),
    title:title,
    org:currentUser,
    orgAvatar:currentUser[0],
    location:loc,
    date:date,
    time:time,
    max:max,
    joined:1,
    desc:desc,
    contact:contact,
    status:'进行中'
  });
  saveActivities(acts);
  
  // Reset
  document.getElementById('actTitle').value='';
  document.getElementById('actDesc').value='';
  document.getElementById('actContact').value='';
  document.getElementById('actDate').value='';
  
  closeModal('activityModal');
  renderActivities();
  renderProfile();
  showToast('🎯 活动发布成功！');
}

// ===== STORAGE =====
function getPhotos(){
  try{var d=JSON.parse(localStorage.getItem('lc_photos'));return Array.isArray(d)?d:[];}catch(e){return [];}
}
function savePhotos(p){localStorage.setItem('lc_photos',JSON.stringify(p));}
function getActivities(){
  try{var d=JSON.parse(localStorage.getItem('lc_activities'));return Array.isArray(d)?d:[];}catch(e){return [];}
}
function saveActivities(a){localStorage.setItem('lc_activities',JSON.stringify(a));}

// ===== TOAST =====
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

// ===== START =====
try{init();}catch(e){console.error(e);document.getElementById('splash').classList.add('hide');}
</script>
