<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c3e50">
<title data-i18n="appName">梨城摄友</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#222;font-size:15px;line-height:1.6;padding-bottom:75px;}
:root{--primary:#2c3e50;--blue:#3498db;--accent:#e67e22;--green:#27ae60;--pink:#e91e63;--bg:#f5f5f5;--card:#fff;--text-light:#888;--border:#eee;--safe:env(safe-area-inset-bottom,0px);}
[dir=rtl]{direction:rtl;}
.app-header{background:linear-gradient(135deg,#2c3e50,#34495e);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:100;}
.app-header .top-row{display:flex;align-items:center;gap:8px;}
.app-header h1{font-size:18px;font-weight:700;flex:1;}
.lang-btn{padding:4px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:11px;cursor:pointer;white-space:nowrap;}
.app-header .sub{font-size:11px;opacity:.7;margin-top:1px;}
.header-tabs{display:flex;gap:3px;margin-top:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;}
.header-tabs .tab{flex:1;text-align:center;padding:6px 0;border-radius:8px;font-size:12px;color:rgba(255,255,255,.6);cursor:pointer;transition:.2s;font-weight:500;}
.header-tabs .tab.active{background:#fff;color:#2c3e50;font-weight:700;}
.page{display:none;}
.page.active{display:block;}
.card{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;}
/* User card */
.user-card{display:flex;gap:12px;padding:14px;align-items:center;}
.user-card .uc-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0;font-weight:700;position:relative;}
.user-card .uc-online{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:#4caf50;}
.user-card .uc-info{flex:1;min-width:0;}
.user-card .uc-name{font-size:15px;font-weight:700;}
.user-card .uc-badge{display:inline-block;font-size:10px;padding:1px 8px;border-radius:8px;margin-left:4px;vertical-align:middle;}
.bg-blue{background:#e3f2fd;color:#1565c0;}
.bg-pink{background:#fce4ec;color:#c62828;}
.bg-green{background:#e8f5e9;color:#2e7d32;}
.user-card .uc-meta{font-size:11px;color:#888;margin-top:1px;display:flex;gap:6px;flex-wrap:wrap;}
.user-card .uc-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;}
.user-card .uc-tag{font-size:10px;background:#f0f2f5;padding:2px 8px;border-radius:8px;color:#555;}
.user-card .uc-right{text-align:right;flex-shrink:0;}
.user-card .uc-stats{font-size:10px;color:#bbb;margin-top:2px;}
/* Filters */
.filter-scroll{padding:8px 12px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-btn{padding:6px 14px;border-radius:16px;border:1.5px solid #ddd;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;color:#555;font-weight:500;}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.role-tabs{display:flex;gap:6px;padding:10px 12px 4px;}
.role-tab{flex:1;text-align:center;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;background:#f0f2f5;color:#888;transition:.2s;}
.role-tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.role-tab .rt-icon{font-size:18px;display:block;margin-bottom:1px;}
/* Portfolio grid */
.port-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:14px;}
.port-item{aspect-ratio:1;background:linear-gradient(135deg,#f0f2f5,#e0e4e8);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#ccc;cursor:pointer;position:relative;overflow:hidden;}
.port-item img{width:100%;height:100%;object-fit:cover;}
.port-item .port-add{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.02);font-size:32px;color:#bbb;border:2px dashed #ddd;border-radius:8px;}
.port-item .port-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:12px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
/* Detail modal */
.detail-section{padding:14px;border-top:1px solid #f0f0f0;}
.detail-section h3{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--primary);}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;}
.tag-item{background:#eef2f7;padding:3px 10px;border-radius:10px;font-size:11px;color:#444;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.info-item{background:#f8f9fa;border-radius:10px;padding:12px;}
.info-item .ii-label{font-size:11px;color:#999;margin-bottom:2px;}
.info-item .ii-value{font-size:13px;font-weight:600;color:#333;}
/* Activity */
.activity-list{padding:12px;}
.activity-card{background:#fff;border-radius:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;}
.activity-card .ac-header{padding:14px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.activity-card .ac-title{font-size:15px;font-weight:700;}
.activity-card .ac-status{font-size:10px;padding:2px 10px;border-radius:10px;flex-shrink:0;background:#e8f5e9;color:#2e7d32;}
.activity-card .ac-body{padding:10px 14px 14px;}
.activity-card .ac-meta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.activity-card .ac-meta-item{font-size:11px;color:#666;margin-right:6px;}
.activity-card .ac-desc{font-size:12px;color:#555;line-height:1.7;margin-bottom:8px;}
.activity-card .ac-org{display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid #f0f0f0;font-size:12px;}
.activity-card .ac-btn{padding:6px 16px;border-radius:8px;border:none;font-size:12px;cursor:pointer;font-weight:600;flex-shrink:0;}
.ac-btn.blue{background:var(--blue);color:#fff;}
.ac-btn.gray{background:#e0e0e0;color:#888;}
/* Spots */
.spot-list{padding:12px;}
.spot-card{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;display:flex;}
.spot-card .spot-icon{width:70px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,#e8f0fe,#d4e4f7);}
.spot-card .spot-body{padding:10px 12px;flex:1;}
.spot-card .spot-name{font-size:14px;font-weight:700;}
.spot-card .spot-type{font-size:10px;color:var(--blue);margin-top:1px;}
.spot-card .spot-desc{font-size:11px;color:#666;margin-top:4px;line-height:1.6;}
.spot-card .spot-count{font-size:10px;color:#bbb;margin-top:4px;}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:18px 20px 24px;animation:slideUp .3s ease-out;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-sheet h2{font-size:17px;margin-bottom:12px;display:flex;gap:8px;align-items:center;}
.modal-close{font-size:20px;cursor:pointer;color:#999;float:right;padding:4px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:3px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit;background:#fafafa;}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--blue);background:#fff;}
.form-group textarea{min-height:60px;resize:vertical;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{padding:5px 12px;border-radius:14px;border:1.5px solid #ddd;font-size:11px;cursor:pointer;background:#fff;transition:.2s;user-select:none;}
.chip.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
.btn-primary:active{transform:scale(.98);}
.btn-green{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-green:active{transform:scale(.98);}
/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;padding:5px 0 calc(5px + var(--safe));z-index:200;}
.bottom-nav .nav-item{flex:1;text-align:center;padding:3px 0;cursor:pointer;}
.bottom-nav .nav-item .ni-icon{font-size:20px;}
.bottom-nav .nav-item .ni-label{font-size:9px;color:#999;margin-top:1px;}
.bottom-nav .nav-item.active .ni-label{color:var(--blue);font-weight:700;}
/* Toast */
#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 18px;border-radius:18px;font-size:12px;z-index:999;opacity:0;transition:.3s;pointer-events:none;max-width:80%;text-align:center;}
#toast.show{opacity:1;}
.empty-state{text-align:center;padding:40px 20px;color:#bbb;}
.empty-state .icon{font-size:40px;margin-bottom:6px;}
.empty-state p{font-size:13px;}
/* Splash */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,#2c3e50,#1a252f);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s;}
#splash.hide{opacity:0;pointer-events:none;}
#splash .logo{font-size:56px;margin-bottom:10px;}
#splash h1{color:#fff;font-size:20px;font-weight:700;}
#splash .sub{color:rgba(255,255,255,.4);font-size:12px;margin-top:4px;}
@media(min-width:600px){body{max-width:480px;margin:0 auto;border-left:1px solid #eee;border-right:1px solid #eee;min-height:100vh;background:#fff;}.bottom-nav{max-width:480px;left:50%;transform:translateX(-50%);}#toast{left:50%;transform:translateX(-50%);}}
</style>
</head>
<body>
<div id="splash"><div class="logo">📸</div><h1 id="splashTitle">梨城摄友</h1><div class="sub" id="splashSub">库尔勒 · 摄影约拍对接平台</div></div>
<div class="app-header">
  <div class="top-row"><h1 id="appTitle">📸 梨城摄友</h1><button class="lang-btn" id="langBtn" onclick="toggleLang()">ئۇيغۇرچە</button></div>
  <div class="sub" id="appSub">库尔勒 · 摄影约拍对接平台</div>
  <div class="header-tabs">
    <div class="tab active" data-tab="discover" onclick="switchTab('discover')"><span id="tDiscover">发现</span></div>
    <div class="tab" data-tab="activity" onclick="switchTab('activity')"><span id="tActivity">活动</span></div>
    <div class="tab" data-tab="spots" onclick="switchTab('spots')"><span id="tSpots">摄点</span></div>
    <div class="tab" data-tab="profile" onclick="switchTab('profile')"><span id="tProfile">我的</span></div>
  </div>
</div>
<!-- DISCOVER -->
<div id="pageDiscover" class="page active">
  <div class="role-tabs" id="roleTabs">
    <div class="role-tab active" onclick="filterRole('all')"><span class="rt-icon">👥</span><span id="rAll">全部</span></div>
    <div class="role-tab" onclick="filterRole('photographer')"><span class="rt-icon">📷</span><span id="rPhoto">摄影师</span></div>
    <div class="role-tab" onclick="filterRole('model')"><span class="rt-icon">💃</span><span id="rModel">模特</span></div>
    <div class="role-tab" onclick="filterRole('team')"><span class="rt-icon">🏢</span><span id="rTeam">团队</span></div>
  </div>
  <div class="filter-scroll" id="styleFilter"></div>
  <div id="discoverList"></div>
</div>
<!-- ACTIVITY -->
<div id="pageActivity" class="page">
  <div style="padding:10px 12px 0;"><button class="btn-green" id="btnStartAct" onclick="showPubModal()">🎯 发起采风活动</button></div>
  <div id="activityList" class="activity-list"></div>
</div>
<!-- SPOTS -->
<div id="pageSpots" class="page"><div id="spotList" class="spot-list"></div></div>
<!-- PROFILE -->
<div id="pageProfile" class="page"><div id="profileContent"></div></div>
<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('discover')"><div class="ni-icon">🔍</div><div class="ni-label" id="navDiscover">发现</div></div>
  <div class="nav-item" onclick="switchTab('activity')"><div class="ni-icon">🎯</div><div class="ni-label" id="navActivity">活动</div></div>
  <div class="nav-item" onclick="switchTab('spots')"><div class="ni-icon">📍</div><div class="ni-label" id="navSpots">摄点</div></div>
  <div class="nav-item" onclick="switchTab('profile')"><div class="ni-icon">👤</div><div class="ni-label" id="navProfile">我的</div></div>
</div>
<!-- Profile Edit Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal-sheet">
    <span class="modal-close" onclick="closeModal('profileModal')">✕</span>
    <h2 id="mTitle">📝 完善我的资料</h2>
    <div class="form-group"><label id="fRole">我是</label>
      <div class="chips" id="roleChips">
        <div class="chip" data-val="photographer" onclick="selectChip('roleChips','photographer')">📷 <span id="rPhoto2">摄影师</span></div>
        <div class="chip" data-val="model" onclick="selectChip('roleChips','model')">💃 <span id="rModel2">模特</span></div>
        <div class="chip" data-val="team" onclick="selectChip('roleChips','team')">🏢 <span id="rTeam2">团队</span></div>
      </div>
    </div>
    <div class="form-group"><label id="fName">昵称/名称</label><input id="editName"></div>
    <div class="form-group"><label id="fArea">所在区域</label>
      <select id="editArea">
        <option value="库尔勒市区">库尔勒市区</option><option value="库尔勒开发区">库尔勒开发区</option>
        <option value="轮台县">轮台县</option><option value="尉犁县">尉犁县</option>
        <option value="博湖县">博湖县</option><option value="焉耆县">焉耆县</option>
        <option value="和静县">和静县</option><option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group"><label id="fStyles">摄影/拍摄风格（可多选）</label>
      <div class="chips" id="styleChips"></div>
    </div>
    <div id="photographerFields" style="display:none;">
      <div class="form-group"><label id="fGear">我的设备（可多选）</label>
        <div class="chips" id="gearChips"></div>
      </div>
      <div class="form-group"><label id="fExp">从业年限</label>
        <select id="editExp">
          <option value="1年以下（入门）">1年以下（入门）</option>
          <option value="1-3年（初级）" selected>1-3年（初级）</option>
          <option value="3-5年（中级）">3-5年（中级）</option>
          <option value="5-10年（高级）">5-10年（高级）</option>
          <option value="10年以上（资深）">10年以上（资深）</option>
        </select>
      </div>
    </div>
    <div id="modelFields" style="display:none;">
      <div class="form-group"><label id="fMTypes">可接受拍摄类型</label>
        <div class="chips" id="modelTypeChips"></div>
      </div>
      <div class="form-group"><label id="fMExp">拍摄经验</label>
        <select id="editModelExp">
          <option value="无经验，想试试">无经验，想试试</option>
          <option value="有一些经验">有一些经验</option>
          <option value="有丰富经验">有丰富经验</option>
          <option value="专业模特">专业模特</option>
        </select>
      </div>
    </div>
    <div id="teamFields" style="display:none;">
      <div class="form-group"><label id="fServices">团队设备/服务（可多选）</label>
        <div class="chips" id="teamServiceChips"></div>
      </div>
    </div>
    <div class="form-group"><label id="fBio">个人简介</label><textarea id="editBio" style="min-height:50px;"></textarea></div>
    <div class="form-group"><label id="fContact">微信号/联系方式（选填）</label><input id="editContact"></div>
    <button class="btn-primary" id="btnSave" onclick="saveProfile()">✅ 保存资料</button>
  </div>
</div>
<!-- User Detail Modal -->
<div class="modal-overlay" id="userDetailModal">
  <div class="modal-sheet">
    <span class="modal-close" onclick="closeModal('userDetailModal')">✕</span>
    <div id="userDetailContent"></div>
  </div>
</div>
<div id="toast"></div>
<script>
// ===== I18N =====
var LANG={zh:{},ug:{}};
// Chinese
LANG.zh={
  appName:'梨城摄友',appSub:'库尔勒 · 摄影约拍对接平台',
  tDiscover:'发现',tActivity:'活动',tSpots:'摄点',tProfile:'我的',
  navDiscover:'发现',navActivity:'活动',navSpots:'摄点',navProfile:'我的',
  rAll:'全部',rPhoto:'摄影师',rModel:'模特',rTeam:'团队',
  rPhoto2:'摄影师',rModel2:'模特',rTeam2:'团队',
  mTitle:'📝 完善我的资料',fRole:'我是',fName:'昵称/名称',fArea:'所在区域',fStyles:'摄影/拍摄风格（可多选）',
  fGear:'我的设备（可多选）',fExp:'从业年限',fMTypes:'可接受拍摄类型',fMExp:'拍摄经验',fServices:'团队设备/服务（可多选）',
  fBio:'个人简介',fContact:'微信号/联系方式（选填）',btnSave:'✅ 保存资料',

  join:'✋ 我要参加',joined:'✅ 已报名',full:'👥 已满',
  works:'📷 作品集',

  myProfile:'👤 我的资料'

// Uyghur
LANG.ug={
  appName:'كۆرۈش سەرخىلى',appSub:'كورلا · فوتوگراف ۋە مودېل تۇتاشتۇرۇش سۇپىسى',
  tDiscover:'بايقاش',tActivity:'پائالىيەت',tSpots:'نۇقتىلار',tProfile:'مېنىڭ',

  rAll:'ھەممىسى',rPhoto:'فوتوگراف',rModel:'مودېل',rTeam:'گۇرۇپپا',
  rPhoto2:'فوتوگراف',rModel2:'مودېل',rTeam2:'گۇرۇپپا',
  mTitle:'📝 ئۇچۇر تولدۇرۇش',fRole:'مەن',fName:'تەخەللۇس',fArea:'رايون',fStyles:'ئۇسلۇبلار (كۆپ تاللاش)',
  fGear:'ئۈسكۈنىلەر (كۆپ تاللاش)',fExp:'تەجرىبە',fMTypes:'قوبۇل قىلىدىغان تىپلار',fMExp:'تەجرىبە',fServices:'مۇلازىمەتلەر (كۆپ تاللاش)',
  fBio:'تونۇشتۇرۇش',fContact:'ئالاقە ئۇسۇلى (ئىختىيارى)',btnSave:'✅ ساقلاش',
  btnStartAct:'🎯 پائالىيەت باشلاش',btnEditProfile:'✏️ تەھرىرلەش',
  noProfile:'ئاۋۋال ئۇچۇر تولدۇرۇڭ',noWorks:'ھازىرچە ئەسەر يوق',emptyUsers:'ماس كېلىدىغان ئىشلەتكۈچى تېپىلمىدى',emptyActivities:'ھازىرچە پائالىيەت يوق',
  styleFilter:'ئۇسلۇب',all:'ھەممىسى',
  interest:'💌 تونۇشۇش · ئالاقىلىشىش',save:'✅ ساقلاش',
  join:'✋ قاتنىشىمەن',joined:'✅ قاتناشتى',full:'👥 تولۇق',
  works:'📷 ئەسەرلەر',
  editProfile:'✏️ تەھرىرلەش',

  document.getElementById('editContact').value=u?u.contact||'':'';
  document.querySelectorAll('.chips .chip').forEach(function(c){c.classList.remove('selected');});
  if(u&&u.role)selectChip('roleChips',u.role);
  (u&&u.styles||[]).forEach(function(s){tog('styleChips',s);});
  (u&&u.gear||[]).forEach(function(g){tog('gearChips',g);});
  (u&&u.mtypes||[]).forEach(function(t){tog('modelTypeChips',t);});
  (u&&u.svc||[]).forEach(function(s){tog('teamServiceChips',s);});
  updateRoleFields();
  document.getElementById('profileModal').classList.add('show');
}
function selectChip(gid,val){
  document.querySelectorAll('#'+gid+' .chip').forEach(function(c){c.classList.toggle('selected',c.dataset.val===val);});
  ed.role=val;updateRoleFields();
}
function tog(gid,val){
  var c=document.querySelector('#'+gid+' .chip[data-val="'+val+'"]');if(!c)return;
  c.classList.toggle('selected');
  var sel=[];document.querySelectorAll('#'+gid+' .chip.selected').forEach(function(x){sel.push(x.dataset.val);});
  if(gid==='styleChips')ed.styles=sel;
  else if(gid==='gearChips')ed.gear=sel;
  else if(gid==='modelTypeChips')ed.mtypes=sel;
  else if(gid==='teamServiceChips')ed.svc=sel;
}
function updateRoleFields(){
  var r=ed.role;
  document.getElementById('photographerFields').style.display=r==='photographer'?'block':'none';
  document.getElementById('modelFields').style.display=r==='model'?'block':'none';
  document.getElementById('teamFields').style.display=r==='team'?'block':'none';
}
function saveProfile(){
  var name=document.getElementById('editName').value.trim();
  if(!name||!ed.role||ed.styles.length===0){showToast('请填写必要信息');return;}
  var u=curUser||{id:'u'+Date.now(),avatar:name[0],color:'#2c3e50'};
  u.name=name;u.role=ed.role;u.area=document.getElementById('editArea').value;
  u.styles=ed.styles;u.bio=document.getElementById('editBio').value.trim();u.contact=document.getElementById('editContact').value.trim();
  if(u.role==='photographer'){u.gear=ed.gear;u.exp=document.getElementById('editExp').value;}
  if(u.role==='model'){u.mtypes=ed.mtypes;u.mexp=document.getElementById('editModelExp').value;}
  if(u.role==='team'){u.svc=ed.svc;}
  curUser=u;saveCurUser();
  var users=gU();var idx=users.findIndex(function(x){return x.id===u.id;});
  if(idx>-1)users[idx]=u;else users.push(u);
  sU(users);closeModal('profileModal');renderProfile();renderDiscover();showToast('✅ '+tr('save'));
}
// ===== PUB ACTIVITY =====
function showPubModal(){
  if(!curUser){showToast('请先完善个人资料');return;}
  var t=prompt('活动名称：'),d=prompt('日期 (如 2026-11-05)：'),l=prompt('地点：'),ds=prompt('活动详情：'),m=prompt('人数上限：','10');
  if(!t||!d||!l||!ds||!m)return;
  var a=gA();a.push({id:'a'+Date.now(),title:t,org:curUser.name,loc:l,date:d,time:'待定',max:parseInt(m)||10,j:1,desc:ds,con:curUser.contact||'',st:'进行中'});
  sA(a);renderActivities();showToast('✅ 已发布');
}
// ===== MODAL =====
function closeModal(id){document.getElementById(id).classList.remove('show');}
// ===== TOAST =====
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
// ===== RENDER ALL =====
function renderAll(){renderDiscover();renderActivities();renderSpots();renderProfile();}
// ===== START =====
try{init();}catch(e){console.error(e);document.getElementById('splash').classList.add('hide');}
</script>
</body>
</html>
